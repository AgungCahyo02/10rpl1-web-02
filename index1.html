<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Saya</title>
    <style>
        .form-control {
            width: 100%;
            box-sizing: border-box;
        }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Gradasi latar belakang hijau */
            background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
        }

        .card, .box { 
            background-color: #ffffff;
            border-top: 5px solid #10b981; /* Aksen hijau emerald di bagian atas */
            padding: 25px; 
            width: 450px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15); /* Bayangan bernuansa hijau */
            box-sizing: border-box;
        }

        /* Mengubah warna fokus garis tepi saat kolom input diklik */
        input:focus, textarea:focus, select:focus {
            outline: 2px solid #10b981;
        }
        
        .garis {
            background-color: #10b981;
            height: 3px;
            border: none;
        }

    </style>
</head>
<body>

    
    <form class="card" action="index2.html" method="get">
        
        <h2>Formulir Biodata</h2>
        <hr class="garis">
        <!-- Nama Anda -->
        <label for="nama">Nama Lengkap:</label><br>
        <input type="text" name="nama" id="nama" required class="form-control"><br><br>

        <!-- Alamat Anda -->
        <label for="alamat">Alamat:</label><br>
        <textarea name="alamat" id="alamat" class="form-control" required></textarea><br><br>

        <!-- Jurusan Yang Dipilih -->
        <label for="jurusan">Jurusan:</label><br>
        <select name="jurusan" id="jurusan" required class="form-control">
        <option value="" disabled selected>-- Pilih Jurusan --</option>
        <option value="RPL">RPL</option>
        <option value="TKJ">TKJ</option>
        <option value="TEI">TEI</option>
        <option value="TKR">TKR</option>
        <option value="TSM">TSM</option>
        </select><br><br>


        <!-- Jenis Kelamin Anda -->
        <label>Jenis Kelamin:</label><br>
        <input id="jk_l" type="radio" name="gender" value="Laki-laki" required><label for="jk_l">Laki-laki</label><br>
        <input id="jk_p" type="radio" name="gender" value="Perempuan" required><label for="jk_p">Perempuan</label><br><br>

        <!-- Tinggi Badan Anda -->
        <label for="TB">Tinggi Badan (cm):</label><br>
        <input type="number" id="TB" name="tinggi" min="1" class="form-control"><br><br>

        <!-- Berat Badan Anda -->
        <label for="BB">Berat Badan (kg):</label><br>
        <input type="number" min="1" id="BB" name="berat" class="form-control"><br><br>

        <!-- Hobi Anda -->
        <label for="hobi">Hobi:</label><br>
        <input type="text" id="hobi" name="hobi" class="form-control"><br><br>

        <!-- No.HP Anda -->
        <label for="nohp">No HP:</label><br>
        <input type="text" id="nohp" name="nohp" required inputmode="numeric" pattern="[0-9]{10,13}" maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="form-control"><br><br>

        <!-- Kirim -->
        <input type="submit" value="Simpan" class="form-control" style="background-color: #10b981;">

    </form>

</body>
</html>
