<!DOCTYPE HTML>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Biodata</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            /* Gradasi latar belakang hijau serasi dengan form */
            background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
        }

        .box { 
            background-color: #ffffff;
            border-top: 5px solid #10b981; /* Aksen hijau emerald */
            padding: 25px; 
            width: 450px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
            box-sizing: border-box;
        }

        p { margin: 10px 0; }

        /* Meringkas gaya tombol link */
        a {
            display: inline-block;
            text-decoration: none;
            background-color: #10b981;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
        }

        .garis {
            background-color: #10b981;
            height: 3px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="box">

        <h2 style="margin-top: 0;">Hasil Pengisian Biodata</h2>
        <hr class="garis">
        <p><strong>Nama Lengkap:</strong> <span id="resNama">-</span></p>
        <p><strong>Alamat:</strong> <span id="resAlamat">-</span></p>
        <p><strong>Jurusan:</strong> <span id="resJurusan">-</span></p>
        <p><strong>Jenis Kelamin:</strong> <span id="resGender">-</span></p>
        <p><strong>Tinggi Badan:</strong> <span id="resTinggi">-</span> cm</p>
        <p><strong>Berat Badan:</strong> <span id="resBerat">-</span> kg</p>
        <p><strong>Hobi:</strong> <span id="resHobi">-</span></p>
        <p><strong>No HP:</strong> <span id="resNoHp">-</span></p>
        <br>
        <a href="index.html">Isi Form Lagi</a>
    </div>

    <script>

        // Membaca data
        const params = new URLSearchParams(window.location.search);

        // Menampilkan data
        document.getElementById('resNama').textContent = params.get('nama') || 'Belum diisi';
        document.getElementById('resAlamat').textContent = params.get('alamat') || 'Belum diisi';
        document.getElementById('resJurusan').textContent = params.get('jurusan') || 'Belum diisi';
        document.getElementById('resGender').textContent = params.get('gender') || 'Belum diisi';
        document.getElementById('resTinggi').textContent = params.get('tinggi') || '-';
        document.getElementById('resBerat').textContent = params.get('berat') || '-';
        document.getElementById('resHobi').textContent = params.get('hobi') || 'Belum diisi';
        document.getElementById('resNoHp').textContent = params.get('nohp') || 'Belum diisi';
    </script>

</body>
</html>
